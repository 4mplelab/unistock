server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # docs-site(Astro Starlight)の静的ビルド。SPAではなくページごとに
    # 静的HTMLを生成しているため、Reactアプリのようなindex.htmlフォールバックはしない

    # ファイル名にハッシュが入るビルド成果物(JS/CSS)は内容が変わればURL自体が変わるため、
    # ブラウザに長期キャッシュさせてよい
    location /docs/_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML自体はファイル名が変わらないため、ブラウザの古いキャッシュがいつまでも
    # 表示され続けないよう毎回サーバーに再検証させる(ドキュメント更新時に
    # ハードリロードしないと反映されない、という問い合わせを防ぐ)
    location /docs/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    # Viteのビルド成果物(ファイル名にハッシュが入る)も同様に長期キャッシュしてよい
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
