# 開発用の差分ファイル。docker-compose.yml(本番用、ビルド済みイメージをpull)に重ねて使う
# (docker compose -f docker-compose.yml -f docker-compose.dev.yml ...)。
# backend/frontend/mcp-serverだけソースからビルドする構成に差し替える。db/db-backup/
# volumes等はdocker-compose.ymlの定義をそのまま使うため、ここには書かない。
#
# imageは本番と同じ名前(${REGISTRY_PATH}/...)にせず、ローカル専用のタグにしている。
# 同じ名前にすると、ローカルでビルドしたイメージが本番用のタグを上書きしてしまい、
# 後で docker compose -f docker-compose.yml up した際に、実際にはpullされず
# ローカルビルド分がそのまま使われてしまう事故につながるため。
services:
  backend:
    build: ./backend
    image: unistock-backend:dev

  frontend:
    # ビルドコンテキストはリポジトリルート(docs-siteを/docsとして一緒にビルドするため)
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: unistock-frontend:dev

  mcp-server:
    build: ./mcp-server
    image: unistock-mcp-server:dev
