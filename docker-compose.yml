services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - unistock_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${REGISTRY_PATH}/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    volumes:
      - unistock_backend_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    image: ${REGISTRY_PATH}/frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
    depends_on:
      - backend
    ports:
      - "3000:80"

  # AIクライアント(Claude Desktop/Claude Code等)からUniStockのデータを参照するための
  # MCPサーバー(読み取り専用)。MCP_API_KEYが未設定の間は起動時にエラー終了するだけで、
  # 他サービスには影響しない
  mcp-server:
    image: ${REGISTRY_PATH}/mcp-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      UNISTOCK_API_BASE_URL: http://backend:8000/api
      UNISTOCK_API_KEY: ${MCP_API_KEY}
      MCP_TRANSPORT: streamable-http
    depends_on:
      - backend
    ports:
      - "${MCP_SERVER_PORT:-8765}:8765"

  # DBの日次バックアップ(pg_dump + 世代管理)。バックアップファイル自体は
  # unistock_db_backups ボリューム(dockerが管理するホスト側ストレージ)に保存される
  db-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 31
      BACKUP_KEEP_WEEKS: 0
      BACKUP_KEEP_MONTHS: 0
    volumes:
      - unistock_db_backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  unistock_db_data:
  unistock_backend_logs:
  unistock_db_backups:
