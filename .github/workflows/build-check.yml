name: Build Check

# PRでbackend/frontendのDockerイメージがビルドできることと、backendの自動テストが
# 通ることを確認する(pushはしない)。実際のイメージ公開・GitHub Release作成は
# release.yml (v*タグpush時) が行う

on:
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: unistock
          POSTGRES_PASSWORD: unistock
          POSTGRES_DB: unistock
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests
        working-directory: backend
        run: pytest

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          # frontendはdocs-site(Astro Starlight)を/docsとして一緒にビルドするため
          # コンテキストをリポジトリルートにする
          - service: frontend
            context: .
            dockerfile: ./frontend/Dockerfile
          - service: mcp-server
            context: ./mcp-server
            dockerfile: ./mcp-server/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
