name: Release

# v* タグをpushしたときだけ実行される。Dockerイメージのビルド・push(バージョンタグ+latest)と、
# 変更履歴付きのGitHub Release作成を両方自動で行う。
#
# タグを打つ以外の通常のmainへのpushではイメージは作られない(latestタグ = 最新の
# リリース、という意味を保つため。日々のコミットごとにlatestが動くローリング運用はしない)。
# ビルドできることの確認だけしたい場合は build-check.yml (PR向け) を使う。
# 手元で動作確認したい場合やCIを使わずpushしたい場合は scripts/build_and_push.sh を使う。
#
# リリースの出し方: git tag vX.Y.Z && git push origin vX.Y.Z

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  pull-requests: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          # frontendはdocs-site(Astro Starlight)を/docsとして一緒にビルドするため
          # コンテキストをリポジトリルートにする
          - service: frontend
            context: .
            dockerfile: ./frontend/Dockerfile
          - service: mcp-server
            context: ./mcp-server
            dockerfile: ./mcp-server/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # backendだけが参照するARG(実行中バージョン表示用)。frontendのDockerfileには
          # 該当ARGが無いため単純に無視される
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          mode: "COMMIT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.notes.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
